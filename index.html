<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion Studio</title>
<meta name="description" content="Arrange songs for a 72-bass accordion: treble and bass rolls, register stops, bellows dynamics, MIDI and Roblox string export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121116; --panel:#1a1920; --panel2:#22212a; --panel3:#2b2a34; --line:#2f2d38; --line2:#3c3a47;
  --text:#ece7dc; --muted:#938ea0; --faint:#5f5b6b;
  --accent:#e0a93b; --accent-2:#f3c46a; --accent-ink:#2a1d05;
  --treble:#f1e6cf; --treble-edge:#b9a782; --bass:#6cc4b8; --bass-edge:#3c8a80;
  --danger:#ff4d57; --danger-2:#ff8a90;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --keys:68px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand svg{flex:none}
.brand b{font-weight:800;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.3px}
.field{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 4px 0 9px;height:32px}
.field label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.field input{background:transparent;border:0;outline:0;height:30px;padding:0 4px}
.field input:focus{color:#fff}
#title{width:190px}
#bpm{width:44px;font-family:var(--mono)}
.spacer{flex:1}
.btn{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:#4a4757}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:15px;height:15px;flex:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:36px;min-width:230px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:50;display:none}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;gap:10px;align-items:center}
.menu-list button:hover{background:var(--panel3)}
.menu-list button span{color:var(--muted);font-size:11px;margin-left:auto}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:7px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.part button.on[data-part=T]{background:var(--treble);color:#2a2418;box-shadow:none}
.seg.part button.on[data-part=B]{background:var(--bass);color:#0e2925;box-shadow:none}
.seg button small{font-family:var(--mono);font-size:10px;opacity:.75;font-weight:600}
.sel{height:32px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 6px}
.divider{width:1px;height:22px;background:var(--line)}
#playBtn{width:40px}
#playBtn.playing{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#pos{font-family:var(--mono);color:var(--muted);min-width:92px}
#warn{display:none;background:rgba(255,77,87,.12);border-color:rgba(255,77,87,.55);color:var(--danger-2)}
#warn.show{display:inline-flex}
#vol{width:84px;accent-color:var(--accent)}

/* ---------- registers ---------- */
#registers{display:flex;align-items:center;gap:14px;padding:8px 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#17161c,#141318);flex-wrap:wrap}
.reg-label{display:flex;flex-direction:column;gap:2px;min-width:118px}
.reg-label b{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.reg-label span{font-size:11px;color:var(--faint)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{width:88px;height:62px;border-radius:10px;border:1px solid var(--line2);background:linear-gradient(180deg,#2b2a33,#1f1e25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;box-shadow:0 3px 0 #0b0a0e,inset 0 1px 0 rgba(255,255,255,.06);transition:transform .08s, box-shadow .08s, border-color .12s}
.tab:hover{border-color:#55525f}
.tab span{font-size:11px;font-weight:700;color:var(--muted)}
.tab i{position:absolute;top:4px;right:6px;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--faint)}
.tab.on{transform:translateY(3px);box-shadow:0 0 0 #0b0a0e,inset 0 2px 6px rgba(0,0,0,.5),0 0 0 2px var(--c);border-color:var(--c);background:linear-gradient(180deg,#1d1c23,#25242c)}
.tab.on span{color:var(--text)}
.tab svg circle.ring{stroke:#cfc8b8}
.tab.on svg circle.ring{stroke:var(--c)}
.tab svg circle.dot{fill:#cfc8b8}
.tab.on svg circle.dot{fill:var(--c)}
#regHint{color:var(--muted);font-size:12px;max-width:340px;line-height:1.4}
#regHint b{color:var(--text)}

/* ---------- editor ---------- */
#editor{flex:1;min-height:0;display:grid;grid-template-columns:var(--keys) 1fr;grid-template-rows:24px 28px 1fr 104px;position:relative;background:var(--bg)}
.corner{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--faint);display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.cell{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.cell canvas{position:absolute;left:0;top:0;display:block}
#keysCell{border-right:1px solid var(--line);border-bottom:0}
#gridCell{border-bottom:0}
#scroller{position:absolute;inset:0;overflow:auto;touch-action:none}
#spacer{position:relative}
#scroller::-webkit-scrollbar{width:11px;height:11px}
#scroller::-webkit-scrollbar-thumb{background:#3a3844;border-radius:8px;border:3px solid var(--bg)}
#scroller::-webkit-scrollbar-track,#scroller::-webkit-scrollbar-corner{background:var(--bg)}
#scroller{scrollbar-color:#3a3844 var(--bg)}
#dynLabel{border-top:1px solid var(--line);border-bottom:0;flex-direction:column;gap:3px}
#dynCell{border-top:1px solid var(--line);border-bottom:0}
#playline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;box-shadow:0 0 8px rgba(224,169,59,.6);z-index:5}
#playline::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--accent)}

/* ---------- status ---------- */
#status{display:flex;align-items:center;gap:16px;padding:5px 14px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11.5px;min-height:28px}
#status .mono{font-family:var(--mono)}
#sfStatus{display:inline-flex;align-items:center;gap:7px}
#sfStatus::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
#sfStatus.ready::before{background:#5ccf8a}
#sfStatus.loading::before{background:var(--accent);animation:pulse 1s infinite}
#sfStatus.error::before{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
#sfLoadBtn{display:none;height:22px;font-size:11px;padding:0 8px}
#sfStatus.error + #sfLoadBtn{display:inline-flex}

/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:rgba(6,5,9,.66);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(2px)}
#modalBg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{margin:0;padding:16px 18px 4px;font-size:16px;font-weight:800}
.modal .body{padding:8px 18px 4px;overflow:auto;line-height:1.5;color:#d7d1c4}
.modal .body p{margin:6px 0 10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
.modal textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px;font-family:var(--mono);font-size:11.5px;resize:vertical;outline:0;word-break:break-all}
.modal table{width:100%;border-collapse:collapse;font-size:12.5px}
.modal th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;padding:6px 8px;border-bottom:1px solid var(--line)}
.modal td{padding:7px 8px;border-bottom:1px solid var(--line)}
.modal td.mono{font-family:var(--mono);font-size:11.5px}
.modal select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;height:28px;padding:0 6px}
.modal .opt{display:flex;align-items:center;gap:8px;margin:8px 0}
.modal .opt input{accent-color:var(--accent)}
.modal code{font-family:var(--mono);background:var(--bg);padding:1px 5px;border-radius:5px;font-size:11.5px}
.modal .stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px;color:var(--muted);font-size:12px}
.modal .stats b{color:var(--text);font-family:var(--mono)}
.kbd-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px}
kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pill-red{color:var(--danger-2);font-weight:700}

#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--line2);padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:120;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1600px){
  #toolSeg button .lbl{display:none}
  #toolSeg button{padding:0 9px}
}
@media (max-width:760px){
  :root{--keys:52px}
  #title{width:120px}
  .tab{width:64px;height:56px}
  #regHint{display:none}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true">
      <rect x="1" y="3" width="8" height="22" rx="2" fill="#f1e6cf"/>
      <path d="M10 4 L13 24 L16 4 L19 24 L22 4 L25 24" fill="none" stroke="#e0a93b" stroke-width="2" stroke-linejoin="round"/>
      <rect x="25" y="3" width="8" height="22" rx="2" fill="#6cc4b8"/>
      <circle cx="29" cy="9" r="1.3" fill="#123"/><circle cx="29" cy="14" r="1.3" fill="#123"/><circle cx="29" cy="19" r="1.3" fill="#123"/>
    </svg>
    <div><b>Accordion Studio</b><small>72-bass · Padderalt soundfont</small></div>
  </div>
  <div class="field"><label for="title">Title</label><input id="title" maxlength="80" autocomplete="off" spellcheck="false"></div>
  <div class="field"><label for="bpm">BPM</label><input id="bpm" maxlength="3" inputmode="numeric" autocomplete="off"></div>
  <div class="field hide-sm"><label for="tsig">Bar</label>
    <select id="tsig" style="background:transparent;border:0;height:30px;outline:0">
      <option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="6">6/4</option>
    </select>
  </div>
  <div class="spacer"></div>
  <div class="menu" id="fileMenu">
    <button class="btn" data-menu>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4.5h4l1.5 1.5H14v7.5H2z"/></svg>Import</button>
    <div class="menu-list">
      <button data-act="importMidi">Import MIDI file… <span>.mid</span></button>
      <button data-act="importString">Paste Roblox string…</button>
      <button data-act="openProject">Open project… <span>.json</span></button>
      <hr>
      <button data-act="saveProject">Save project <span>.json</span></button>
      <button data-act="newSong">New song</button>
    </div>
  </div>
  <div class="menu" id="exportMenu">
    <button class="btn primary" data-menu>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>Export</button>
    <div class="menu-list">
      <button data-act="exportString">Roblox string… <span>for the game</span></button>
      <button data-act="exportMidi">MIDI file <span>6 tracks, audio</span></button>
    </div>
  </div>
  <button class="btn icon" data-act="help" title="Help and shortcuts">?</button>
</header>

<div id="toolbar">
  <button class="btn icon" id="playBtn" title="Play / stop (Space)">
    <svg id="playIcon" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>
  </button>
  <button class="btn icon" data-act="toStart" title="Back to start (Home)">
    <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2.5" y="3" width="2" height="10" rx=".5"/><path d="M13.5 3v10L6 8z"/></svg>
  </button>
  <span id="pos">1 · 1 · 00</span>
  <div class="divider"></div>
  <div class="seg part" id="partSeg">
    <button data-part="T" class="on" title="Edit the treble keyboard (Tab)">Treble <small>43–76</small></button>
    <button data-part="B" title="Edit the bass buttons (Tab)">Bass <small>72 buttons</small></button>
  </div>
  <div class="seg" id="toolSeg">
    <button data-tool="draw" class="on" title="Draw notes (D)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l1-3.5 7-7 2.5 2.5-7 7zM9.5 4l2.5 2.5"/></svg><span class="lbl">Draw</span></button>
    <button data-tool="select" title="Select and move (S)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2l9 6-4 .8 2.3 4.4-1.7.9-2.3-4.4-3.3 2.6z"/></svg><span class="lbl">Select</span></button>
    <button data-tool="erase" title="Erase (E)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 13.5h7.5M2.8 9.6l6.4-6.4 4 4-6.3 6.3H5.4z"/></svg><span class="lbl">Erase</span></button>
  </div>
  <select class="sel" id="gridSel" title="Grid / snap">
    <option value="4">1/1</option><option value="2">1/2</option><option value="1">1/4</option>
    <option value="0.5" selected>1/8</option><option value="0.25">1/16</option><option value="0.125">1/32</option>
    <option value="0.3333333333">1/8 triplet</option><option value="0.1666666667">1/16 triplet</option>
  </select>
  <div class="seg hide-sm">
    <button data-act="zoomOut" title="Zoom out (−)">−</button>
    <button data-act="zoomIn" title="Zoom in (+)">+</button>
  </div>
  <div class="seg hide-sm">
    <button data-act="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5.5 3.5L2.5 6.5l3 3M3 6.5h6.5a3.5 3.5 0 010 7H7"/></svg></button>
    <button data-act="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 3.5l3 3-3 3M13 6.5H6.5a3.5 3.5 0 000 7H9"/></svg></button>
  </div>
  <button class="btn" id="warn" title="Notes outside the playable range. Click to select them.">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2l6.5 11.5h-13zM8 6.5v3.2M8 11.6v.2"/></svg><span id="warnText"></span>
  </button>
  <button class="btn" id="fixBtn" style="display:none" title="Move every red treble note up or down by whole octaves until it fits">Fit by octave</button>
  <button class="btn" id="acceptBtn" style="display:none" title="Keep every guessed bass chord as it is">Keep guesses</button>
</div>

<div id="registers">
  <div class="reg-label"><b>Treble register</b><span>One stop at a time</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="regHint">Click a stop to switch to it at the <b>playhead</b>. Changes show in the <b>Stops</b> lane. Drag a marker to move it, or right-click it to remove it.</div>
</div>

<div id="editor">
  <div class="corner">Bar</div>
  <div class="cell" id="rulerCell"><canvas id="ruler"></canvas></div>
  <div class="corner">Stops</div>
  <div class="cell" id="stopCell"><canvas id="stopLane"></canvas></div>
  <div class="cell" id="keysCell"><canvas id="keys"></canvas></div>
  <div class="cell" id="gridCell"><canvas id="grid"></canvas><div id="scroller"><div id="spacer"></div></div></div>
  <div class="corner" id="dynLabel"><span>Bellows</span><span style="font-family:var(--mono);font-weight:600;letter-spacing:0;color:var(--muted)" id="dynReadout">mf</span></div>
  <div class="cell" id="dynCell"><canvas id="dynLane"></canvas></div>
  <div id="playline"></div>
</div>

<div id="status">
  <span id="hover" class="mono">&nbsp;</span>
  <span class="spacer"></span>
  <label style="display:flex;align-items:center;gap:7px">Volume <input type="range" id="vol" min="0" max="1.5" step="0.01" value="0.9"></label>
  <span id="counts"></span>
  <span id="sfStatus" class="loading">Loading soundfont…</span>
  <button class="btn" id="sfLoadBtn">Choose .sf2…</button>
</div>

<div id="modalBg"></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* =========================================================
   Constants
   ========================================================= */
const RANGE = { T: [43, 76], B: [36, 107] }; // bass "rows" 36-107 = the 72 Stradella buttons
const PROG_NAMES = ['Bandoneon', 'Bassoon', 'Clarinet', 'Master', 'Musette', 'Bass'];
const BASS_PROG = 5;
const SF_URL = 'PadderaltAccordion.sf2';
// UI order: fewest reeds -> most. dots = reed ranks in the classic register symbol (top=4', middle=8', bottom=16')
const STOPS = [
  { prog: 1, name: 'Bassoon',   color: '#c9874f', dots: [[0, 8.5]] },
  { prog: 2, name: 'Clarinet',  color: '#5b9be0', dots: [[0, 0]] },
  { prog: 0, name: 'Bandoneon', color: '#a27be0', dots: [[0, 0], [0, 8.5]] },
  { prog: 4, name: 'Musette',   color: '#45c08f', dots: [[-5.5, 0], [0, 0], [5.5, 0]] },
  { prog: 3, name: 'Master',    color: '#e0a93b', dots: [[0, -8.5], [-5.5, 0], [0, 0], [5.5, 0], [0, 8.5]] },
];
const STOP_BY_PROG = {}; STOPS.forEach(s => STOP_BY_PROG[s.prog] = s);
const NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const noteName = p => NOTE_NAMES[((p % 12) + 12) % 12] + (Math.floor(p / 12) - 1);
const isBlack = p => [1, 3, 6, 8, 10].includes(((p % 12) + 12) % 12);
const DYN_MARKS = [['ppp', 16], ['pp', 33], ['p', 49], ['mp', 64], ['mf', 80], ['f', 96], ['ff', 112], ['fff', 127]];
const dynMark = v => { let best = DYN_MARKS[0]; for (const m of DYN_MARKS) if (Math.abs(m[1] - v) < Math.abs(best[1] - v)) best = m; return best[0]; };
/* ---- 72-bass Stradella buttons ----
   A bass-part note's row p (36-107) is a button: kind = floor((p-36)/12), root = (p-36) % 12.
   kinds: 0 counterbass, 1 bass, 2 major, 3 minor, 4 seventh, 5 diminished */
const BASS_KINDS = [
  { k: 'C', name: 'counterbass', label: 'cb',   iv: [4] },
  { k: 'B', name: 'bass',        label: 'bass', iv: [0] },
  { k: 'M', name: 'major',       label: 'maj',  iv: [0, 4, 7] },
  { k: 'm', name: 'minor',       label: 'min',  iv: [0, 3, 7] },
  { k: '7', name: 'seventh',     label: '7',    iv: [0, 4, 10] },

//   T<ms>:<note>:<lenMs>         treble note (43-76)

  if (!open) m.classList.add('open'); e.stopPropagation();
}));
document.addEventListener('click', () => document.querySelectorAll('.menu').forEach(x => x.classList.remove('open')));
const ACTIONS = {
  importMidi: () => pickFile('.mid,.midi,audio/midi', async f => importMidiDialog(await f.arrayBuffer(), f.name)),
  importString: importStringDialog,
  openProject: () => pickFile('.json,application/json', async f => {
    try { const o = JSON.parse(await f.text()); const before = snapshot(); loadSong(o.song || o); undoStack.push(before); toast('Project opened'); }
    catch (e) { alertModal('Could not open project', e.message); }
  }),
  saveProject: () => download(JSON.stringify({ format: 'accordion-studio', version: 1, song: JSON.parse(snapshot()) }, null, 1), slug() + '.accordion.json', 'application/json'),
  newSong: () => modal('Start a new song?', '<p>This clears the editor. You can still undo it.</p>', [
    { label: 'Cancel' },
    { label: 'New song', primary: true, onClick: () => { stop(); const before = snapshot(); loadSong(newSong()); undoStack.push(before); } },
  ]),
  exportMidi, exportString, help: helpModal,
  toStart: () => seek(0),
  zoomIn: () => zoomAt(1.25), zoomOut: () => zoomAt(0.8),
  undo, redo,
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.act] && ACTIONS[b.dataset.act]()));

document.addEventListener('keydown', e => {
  if ($('#modalBg').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'a') { e.preventDefault(); selection = new Set(song.notes.filter(n => n.part === part).map(n => n.id)); render(); return; }
  if (mod && k === 'c') { e.preventDefault(); copySelection(); return; }
  if (mod && k === 'x') { e.preventDefault(); if (copySelection()) deleteSelection(); return; }
  if (mod && k === 'v') { e.preventDefault(); paste(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && k === 's') { e.preventDefault(); ACTIONS.saveProject(); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); transpose((e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 12 : 1)); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); nudge((e.key === 'ArrowRight' ? 1 : -1) * grid); return; }
  if (e.key === 'Tab') { e.preventDefault(); setPart(part === 'T' ? 'B' : 'T'); return; }
  if (e.key === 'Escape') { selection.clear(); render(); return; }
  if (e.key === 'Home') { seek(0); scroller.scrollLeft = 0; return; }
  if (k === 'd') setTool('draw'); else if (k === 's') setTool('select'); else if (k === 'e') setTool('erase');
  else if (e.key === '+' || e.key === '=') zoomAt(1.25); else if (e.key === '-') zoomAt(0.8);
});

new ResizeObserver(() => { updateSpacer(); drawAll(); }).observe($('#editor'));
window.addEventListener('resize', render);

/* ---------- boot ---------- */
buildTabs();
(() => {
  let saved = null;
  try { saved = localStorage.getItem('accordion-studio-song'); } catch (e) {}
  if (saved) { try { loadSong(JSON.parse(saved)); } catch (e) { loadSong(newSong()); } }
  else loadSong(newSong());
})();
requestAnimationFrame(() => { centerOnRange(); drawAll(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
loadSoundfont();
// expose a tiny API for testing / power users
window.AccordionStudio = { get song() { return song; }, buildString, parseString, buildMidi, parseMidi, loadSong };
</script>
</body>
</html>
